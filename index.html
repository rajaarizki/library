<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Library — a reading journal</title>
<meta name="description" content="A personal digital library and reading journal.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ===================== NAV ===================== -->
<header class="site-header">
  <div class="header-inner">
    <a href="#/home" class="brand">
      <span class="brand-mark">&#9776;</span>
      <span class="brand-name">My Library</span>
    </a>
    <nav class="main-nav" id="main-nav">
      <a href="#/home" data-route="home">Home</a>
      <a href="#/library" data-route="library">My Library</a>
      <a href="#/currently-reading" data-route="currently-reading">Currently Reading</a>
      <a href="#/want-to-read" data-route="want-to-read">Want to Read</a>
      <a href="#/journal" data-route="journal">Journal</a>
      <a href="#/stats" data-route="stats">Stats</a>
    </nav>
    <div class="header-actions">
      <button class="btn btn-ghost" id="open-add-book">+ Add a book</button>
      <a href="#/profile" class="avatar-chip" id="nav-avatar" title="Profile">A</a>
    </div>
    <button class="nav-toggle" id="nav-toggle" aria-label="Open menu">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>

<main id="app"></main>

<footer class="site-footer">
  <p>My Library — a quiet place to keep the stories you've loved.</p>
</footer>

<!-- ===================== ADD / EDIT BOOK MODAL ===================== -->
<div class="modal-overlay" id="book-modal-overlay">
  <div class="modal book-modal" role="dialog" aria-modal="true" aria-labelledby="book-modal-title">
    <button class="modal-close" data-close-modal>&times;</button>
    <h2 id="book-modal-title" class="modal-title">Add a book</h2>
    <form id="book-form" class="book-form">
      <input type="hidden" id="bf-id">
      <div class="field-row">
        <label for="bf-title">Title</label>
        <input type="text" id="bf-title" required placeholder="The Name of the Wind">
      </div>
      <div class="field-row">
        <label for="bf-author">Author</label>
        <input type="text" id="bf-author" required placeholder="Patrick Rothfuss">
      </div>
      <div class="field-row two-up">
        <div>
          <label for="bf-genre">Genre</label>
          <input type="text" id="bf-genre" placeholder="Fantasy">
        </div>
        <div>
          <label for="bf-status">Status</label>
          <select id="bf-status">
            <option value="want">Want to Read</option>
            <option value="reading">Currently Reading</option>
            <option value="finished">Finished</option>
          </select>
        </div>
      </div>
      <div class="field-row two-up">
        <div>
          <label for="bf-pages">Pages</label>
          <input type="number" id="bf-pages" min="1" placeholder="320">
        </div>
        <div>
          <label for="bf-isbn">ISBN</label>
          <input type="text" id="bf-isbn" placeholder="optional">
        </div>
      </div>
      <div class="field-row">
        <label for="bf-desc">Description</label>
        <textarea id="bf-desc" rows="3" placeholder="A few lines about the book..."></textarea>
      </div>
      <div class="field-row">
        <label>Spine color</label>
        <div class="swatch-row" id="bf-swatches"></div>
      </div>
      <div class="field-row checkbox-row">
        <label class="checkbox-label"><input type="checkbox" id="bf-favorite"> Mark as favorite</label>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" id="bf-delete" style="display:none;">Remove book</button>
        <button type="submit" class="btn btn-primary">Save to shelf</button>
      </div>
    </form>
  </div>
</div>

<!-- ===================== TOAST ===================== -->
<div class="toast" id="toast"></div>

<script src="js/data.js"></script>
<script src="js/store.js"></script>
<script src="js/render.js"></script>
<script src="js/app.js"></script>
</body>
</html>
